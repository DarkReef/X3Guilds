name: Orchestrator tests

on:
  pull_request:
    paths:
      - "orchestrator/**"
      - "docs/AI_CHAT_ARCHITECTURE.md"
      - ".github/workflows/orchestrator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestrator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            orchestrator
            docs/AI_CHAT_ARCHITECTURE.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/pyproject.toml
      - name: Install
        run: python -m pip install -e './orchestrator[dev]'
      - name: Test
        run: python -m pytest orchestrator/tests
