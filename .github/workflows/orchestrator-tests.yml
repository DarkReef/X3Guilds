name: Living communications tests

on:
  pull_request:
    paths:
      - "orchestrator/**"
      - "scripts/working/*ai.chat*.xs"
      - "t/9980-L*.xml"
      - "BUILD/*ai-chat*.ps1"
      - ".github/workflows/orchestrator-tests.yml"
  push:
    branches: [main]
    paths:
      - "orchestrator/**"
      - "scripts/working/*ai.chat*.xs"
      - "t/9980-L*.xml"
      - "BUILD/*ai-chat*.ps1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            orchestrator
            scripts/working/setup.plugin.guilds.ai.chat.xs
            scripts/working/plugin.guilds.ai.chat.hotkey.xs
            t/9980-L044.xml
            t/9980-L007.xml
            BUILD/build-ai-chat-scripts.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator/pyproject.toml
      - name: Install
        run: python -m pip install -e './orchestrator[dev]'
      - name: Test
        run: python -m pytest orchestrator/tests
      - name: Compile Python bytecode
        run: python -m compileall -q orchestrator/x3guilds_ai
      - name: Validate XScript source contract
        shell: python
        run: |
          from pathlib import Path
          setup = Path("scripts/working/setup.plugin.guilds.ai.chat.xs").read_text()
          hotkey = Path("scripts/working/plugin.guilds.ai.chat.hotkey.xs").read_text()
          assert 'registerEventHotkey("plugin.guilds.ai.chat.hotkey"' in setup
          assert 'XUGC|1|CHAT_CONTEXT|' in hotkey
          assert 'writeLogFile(9980, TRUE, $line)' in hotkey
