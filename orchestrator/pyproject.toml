[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x3guilds-ai-orchestrator"
version = "0.3.0"
description = "GigaChat dialogue, memory and overlay sidecar for X3 Guilds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
x3guilds-ai = "x3guilds_ai.api:run"
x3guilds-ai-desktop = "x3guilds_ai.runtime:run_desktop"
x3guilds-ai-bridge = "x3guilds_ai.bridge_cli:run"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["x3guilds_ai*"]
